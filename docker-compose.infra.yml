services:
  mongodb:
    image: mongo:6.0
    container_name: SkillMaster-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - ./mongo-data:/data/db

  SkillMaster-redis:
    image: redis:alpine
    container_name: SkillMaster-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:

